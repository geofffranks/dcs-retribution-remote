<div class="control-container">
    <header>
        <div class="refresh-container">
            <button id="refresh-button" class="icon-button" data-tooltip="Refresh Server Status">
                <img src="/static/ui/refresh.svg" alt="Refresh Icon">
            </button>
        </div>
    </header>
    <div id="status-label" class="status-stopped" aria-live="polite">
        Server Status: <span id="status-value">Stopped</span>
    </div>
    <main>
        <div class="button-container">
            <button id="upload-button" class="action-button" data-tooltip="Upload .miz">
                <img src="/static/ui/upload.svg" alt="Upload Icon" class="upload-icon-default">
                <svg class="upload-ring" viewBox="0 0 100 100" aria-hidden="true">
                    <circle class="ring-track"    cx="50" cy="50" r="44"/>
                    <circle class="ring-progress" cx="50" cy="50" r="44"/>
                </svg>
                <span class="upload-pct" aria-hidden="true">0%</span>
                <span class="upload-result-icon" aria-hidden="true"></span>
            </button>
            <input type="file" id="file-input" style="display: none;">
            <button id="power-button" class="action-button off" data-tooltip="Start Server">
                <img src="/static/ui/power.svg" alt="Power Icon">
            </button>
            <button id="download-button" class="action-button" data-tooltip="state.json">
                <img src="/static/ui/download.svg" alt="Download Icon">
            </button>
        </div>
    </main>
    <footer>
        <a href="https://github.com/omltcat/dcs-retribution-remote" target="_blank" rel="noopener noreferrer">
            DCS Retribution/Liberation<br>
            Dedicated Server Remote Control
        </a>
    </footer>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</div>
